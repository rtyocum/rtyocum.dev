<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{'/assets/css/styles.css' | relative_url}}">

	<!-- Preconnect and preload Google Fonts for performance -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://challenges.cloudflare.com" />

	<link rel="preload"
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;700&display=swap"
		as="style" onload="this.onload=null;this.rel='stylesheet'">

	<noscript>
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;700&display=swap">
	</noscript>
	<link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
	{% seo %}
	<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
	<main>
		{% include navigation.html %}
		{{ content }}
	</main>
	{% include footer.html %}
</body>

</html>
